<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- تدرج الخلفية الزمردية -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5D43" />
      <stop offset="100%" stop-color="#083A2A" />
    </linearGradient>
    <!-- تدرج القوس السفلي -->
    <linearGradient id="favSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E9B78" />
      <stop offset="100%" stop-color="#76C8A8" />
    </linearGradient>
  </defs>

  <!-- خلفية الأيقونة المربعة بحواف ناعمة -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#favBgGrad)" />

  <!-- جسم التقويم الأساسي -->
  <rect x="28" y="30" width="60" height="52" rx="12" fill="#FFFFFF" />
  <!-- تفريغ مساحة الأيام داخل التقويم -->
  <rect x="35" y="47" width="46" height="28" rx="6" fill="#094834" />

  <!-- حلقات التقويم العلوية مع حدود مفرغة -->
  <rect x="41" y="20" width="8" height="17" rx="4" fill="#FFFFFF" stroke="#0A4F39" stroke-width="3" />
  <rect x="67" y="20" width="8" height="17" rx="4" fill="#FFFFFF" stroke="#0A4F39" stroke-width="3" />

  <!-- مربعات الأيام الداخلية -->
  <g fill="#63B999">
    <rect x="40" y="52" width="8" height="7" rx="2" />
    <rect x="53" y="52" width="8" height="7" rx="2" />
    <rect x="66" y="52" width="8" height="7" rx="2" />
    <rect x="40" y="63" width="8" height="7" rx="2" />
    <rect x="53" y="63" width="8" height="7" rx="2" />
  </g>

  <!-- القوس الانسيابي أسفل يسار التقويم -->
  <path d="M 28 64 C 15 76, 22 96, 48 93 C 56 92, 62 89, 66 86 C 58 87, 46 87, 37 83 C 27 79, 25 71, 28 64 Z" fill="url(#favSwooshGrad)" />

  <!-- علامة الصح مع التفريغ المحيط بها -->
  <path d="M 62 72 L 73 83 L 98 56" fill="none" stroke="#094531" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 62 72 L 73 83 L 98 56" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>