<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <style>
      .wordmark-main {
        font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 66px;
        fill: #0B5D43;
      }
      .wordmark-tagline {
        font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 18px;
        fill: #3E9B78;
      }
    </style>
  </defs>

  <!-- الكلمة الرئيسية: مواظب -->
  <text x="245" y="72" class="wordmark-main">مواظب</text>

  <!-- علامة صح صغيرة تجميلية أعلى يسار الكلمة -->
  <path d="M 220 35 L 226 41 L 238 28" fill="none" stroke="#3E9B78" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- الخط الفاصل الأوسط -->
  <rect x="202" y="25" width="2.5" height="62" rx="1.25" fill="#0B5D43" opacity="0.35" />

  <!-- الشعار اللفظي (Tagline) من الهوية البصرية -->
  <text x="186" y="52" text-anchor="end" class="wordmark-tagline" fill="#122B23">حضور منظم..</text>
  <text x="186" y="78" text-anchor="end" class="wordmark-tagline">لبيئة تعليمية أفضل</text>
</svg>